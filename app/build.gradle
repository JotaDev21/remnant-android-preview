// Assinatura de release: NUNCA no repositório. Lida de `keystore.properties` (ignorado pelo git)
// ou de variáveis de ambiente. Sem nenhuma das duas fontes o release compila sem assinatura
// (APK/AAB "unsigned"), o que basta para análise local e impede instalação acidental.
def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file('keystore.properties')
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}
def signingValue = { String prop, String env ->
    def fromFile = keystoreProps.getProperty(prop)
    if (fromFile != null && !fromFile.trim().isEmpty()) return fromFile.trim()
    def fromEnv = System.getenv(env)
    return (fromEnv != null && !fromEnv.trim().isEmpty()) ? fromEnv.trim() : null
}
def releaseStorePath = signingValue('storeFile', 'REMNANT_KEYSTORE_PATH')
def releaseStorePassword = signingValue('storePassword', 'REMNANT_KEYSTORE_PASSWORD')
def releaseKeyAlias = signingValue('keyAlias', 'REMNANT_KEY_ALIAS')
def releaseKeyPassword = signingValue('keyPassword', 'REMNANT_KEY_PASSWORD')
def hasReleaseSigning = releaseStorePath != null && releaseStorePassword != null && releaseKeyAlias != null && releaseKeyPassword != null

// Endpoint HTTPS opcional do REM (docs/REM_PROXY.md). Vazio = modo BYOK para testes com uma
// chave Gemini guardada só no aparelho. Em produção, a Edge Function guarda a chave no servidor.
def mentorProxyUrl = (project.findProperty('remnantMentorProxyUrl') ?: System.getenv('REMNANT_MENTOR_PROXY_URL') ?: '').toString().trim()
if (!mentorProxyUrl.isEmpty() && !mentorProxyUrl.startsWith('https://')) {
    throw new IllegalStateException("REMNANT_MENTOR_PROXY_URL tem de começar por https://")
}
def productionReleaseRequested = gradle.startParameter.taskNames.any {
    it.toLowerCase(Locale.ROOT).contains('productionrelease')
}
if (productionReleaseRequested && mentorProxyUrl.isEmpty()) {
    throw new IllegalStateException('A release de produção exige REMNANT_MENTOR_PROXY_URL. O REM não pode pedir chave Gemini ao usuário final.')
}

android {
    namespace 'com.liferpg'
    compileSdk 36

    flavorDimensions += 'distribution'

    defaultConfig {
        // Identidade PERMANENTE da reconstrução. Diferente do Remnant original
        // (com.aistudio.liferpg.xrkyzd) para que os dois coexistam no mesmo aparelho.
        applicationId 'com.liferpg.remnant'
        minSdk 26
        targetSdk 36
        versionCode 44
        versionName '2.1-alpha42'
        resValue 'string', 'app_name', 'REMNANT'
        buildConfigField 'String', 'MENTOR_PROXY_URL', "\"${mentorProxyUrl.replace('\\', '\\\\').replace('"', '\\"')}\""
    }

    productFlavors {
        preview {
            dimension 'distribution'
            // Separate package for the public preview.
            applicationId 'com.jotadev21.remnant.preview'
        }
        production {
            dimension 'distribution'
            applicationId 'com.liferpg.remnant'
        }
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseStorePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
                enableV1Signing false
                enableV2Signing true
                enableV3Signing true
            }
        }
    }

    buildTypes {
        debug {
            resValue 'string', 'app_name', 'Remnant Preview'
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }


    // Só existem as duas combinações que fazem sentido: PreviewDebug para desenvolvimento e
    // ProductionRelease para distribuição. Isso também impede instalar uma release por engano
    // sobre o pacote Preview ou publicar uma build de produção depurável.
    variantFilter { variant ->
        def flavors = variant.flavors*.name
        if ((variant.buildType.name == 'release' && flavors.contains('preview')) ||
            (variant.buildType.name == 'debug' && flavors.contains('production'))) {
            variant.ignore = true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    buildFeatures {
        compose true
        resValues true
        buildConfig true
    }
    packaging {
        resources { excludes += '/META-INF/{AL2.0,LGPL2.1}' }
    }
    testOptions {
        unitTests {
            includeAndroidResources = true
            returnDefaultValues = true
        }
    }
}

