# REMNANT — version catalog reconstruído do APK.
# Todas as versões marcadas [EXACTA] foram lidas de META-INF/*.version ou *.properties
# dentro do próprio APK — são exactamente as que o teu build usava.
# As marcadas [INFERIDA] não deixam marcador no binário; ajusta se o build falhar.

[versions]
agp                = "9.1.1"      # [EXACTA] META-INF/com/android/build/gradle/app-metadata.properties
kotlin             = "2.0.21"     # [INFERIDA] compatível com Compose 1.7.2 / compiler plugin embutido
ksp                = "2.0.21-1.0.28" # [INFERIDA] tem de casar com a versão do Kotlin

coreKtx            = "1.18.0"     # [EXACTA]
appcompat          = "1.6.1"      # [EXACTA]
activityCompose    = "1.10.1"     # [EXACTA]
lifecycle          = "2.8.7"      # [EXACTA]
work               = "2.11.2"
navigationCompose  = "2.8.9"      # [EXACTA]

composeUi          = "1.7.2"      # [EXACTA] ui/runtime/foundation/animation
composeMaterial3   = "1.3.0"      # [EXACTA]
composeMaterialIcons= "1.7.0"     # [EXACTA] material-icons-extended

room               = "2.7.0"      # [EXACTA]
sqlite             = "2.5.0"      # [EXACTA]

healthConnect      = "1.1.0-rc03" # [EXACTA]
camerax            = "1.4.2"      # [EXACTA]
mlkitBarcode       = "17.3.0"     # [EXACTA] barcode-scanning.properties
playServicesMlkitBarcode = "18.3.1" # [EXACTA]

coroutines         = "1.10.2"     # [EXACTA]
okhttp             = "4.12.0"     # [EXACTA] user-agent string no DEX
retrofit           = "2.11.0"     # [INFERIDA] presente no DEX, sem marcador de versão
moshi              = "1.15.1"     # [INFERIDA] presente no DEX, sem marcador de versão
coil               = "2.7.0"      # [INFERIDA] namespace `coil/` => Coil 2.x (não coil3)
exifinterface      = "1.3.7"      # [EXACTA]
profileinstaller   = "1.4.0"      # [EXACTA]

[libraries]
androidx-core-ktx           = { module = "androidx.core:core-ktx",                       version.ref = "coreKtx" }
androidx-appcompat          = { module = "androidx.appcompat:appcompat",                 version.ref = "appcompat" }
androidx-activity-compose   = { module = "androidx.activity:activity-compose",           version.ref = "activityCompose" }
androidx-exifinterface      = { module = "androidx.exifinterface:exifinterface",         version.ref = "exifinterface" }
androidx-profileinstaller   = { module = "androidx.profileinstaller:profileinstaller",   version.ref = "profileinstaller" }

androidx-lifecycle-runtime-ktx      = { module = "androidx.lifecycle:lifecycle-runtime-ktx",      version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose  = { module = "androidx.lifecycle:lifecycle-runtime-compose",  version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose= { module = "androidx.lifecycle:lifecycle-viewmodel-compose",version.ref = "lifecycle" }
androidx-lifecycle-process          = { module = "androidx.lifecycle:lifecycle-process",          version.ref = "lifecycle" }
androidx-work-runtime-ktx           = { module = "androidx.work:work-runtime-ktx",                 version.ref = "work" }

androidx-navigation-compose = { module = "androidx.navigation:navigation-compose",       version.ref = "navigationCompose" }

compose-ui                  = { module = "androidx.compose.ui:ui",                       version.ref = "composeUi" }
compose-ui-graphics         = { module = "androidx.compose.ui:ui-graphics",              version.ref = "composeUi" }
compose-ui-tooling          = { module = "androidx.compose.ui:ui-tooling",               version.ref = "composeUi" }
compose-ui-tooling-preview  = { module = "androidx.compose.ui:ui-tooling-preview",       version.ref = "composeUi" }
compose-foundation          = { module = "androidx.compose.foundation:foundation",       version.ref = "composeUi" }
compose-animation           = { module = "androidx.compose.animation:animation",         version.ref = "composeUi" }
compose-material3           = { module = "androidx.compose.material3:material3",         version.ref = "composeMaterial3" }
compose-material-icons-ext  = { module = "androidx.compose.material:material-icons-extended", version.ref = "composeMaterialIcons" }

room-runtime  = { module = "androidx.room:room-runtime",  version.ref = "room" }
room-ktx      = { module = "androidx.room:room-ktx",      version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
room-testing  = { module = "androidx.room:room-testing",  version.ref = "room" }
sqlite        = { module = "androidx.sqlite:sqlite",      version.ref = "sqlite" }

health-connect = { module = "androidx.health.connect:connect-client", version.ref = "healthConnect" }

camera-core      = { module = "androidx.camera:camera-core",      version.ref = "camerax" }
camera-camera2   = { module = "androidx.camera:camera-camera2",   version.ref = "camerax" }
camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "camerax" }
camera-view      = { module = "androidx.camera:camera-view",      version.ref = "camerax" }
camera-video     = { module = "androidx.camera:camera-video",     version.ref = "camerax" }

mlkit-barcode              = { module = "com.google.mlkit:barcode-scanning",                          version.ref = "mlkitBarcode" }
play-services-mlkit-barcode= { module = "com.google.android.gms:play-services-mlkit-barcode-scanning",version.ref = "playServicesMlkitBarcode" }

coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
coroutines-guava   = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-guava",   version.ref = "coroutines" }
coroutines-test    = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test",    version.ref = "coroutines" }

okhttp             = { module = "com.squareup.okhttp3:okhttp",            version.ref = "okhttp" }
retrofit           = { module = "com.squareup.retrofit2:retrofit",        version.ref = "retrofit" }
retrofit-moshi     = { module = "com.squareup.retrofit2:converter-moshi", version.ref = "retrofit" }
moshi              = { module = "com.squareup.moshi:moshi",               version.ref = "moshi" }
moshi-codegen      = { module = "com.squareup.moshi:moshi-kotlin-codegen",version.ref = "moshi" }

coil-compose = { module = "io.coil-kt:coil-compose", version.ref = "coil" }

[plugins]
android-application = { id = "com.android.application",              version.ref = "agp" }
kotlin-android      = { id = "org.jetbrains.kotlin.android",         version.ref = "kotlin" }
kotlin-compose      = { id = "org.jetbrains.kotlin.plugin.compose",  version.ref = "kotlin" }
ksp                 = { id = "com.google.devtools.ksp",              version.ref = "ksp" }
